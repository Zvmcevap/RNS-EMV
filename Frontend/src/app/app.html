@if (isAuthPage()) {
  <div class="auth-layout">
    <router-outlet></router-outlet>
  </div>
} @else {
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">{{ getAppLogoLetter() }}</div> 
        <span class="brand-name">{{ title() }}</span> 
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Menu</div>
        
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/employees" routerLinkActive="active" class="nav-item">
          <i class="bi bi-people-fill"></i>
          <span>Employees</span>
        </a>
        <a routerLink="/departments" routerLinkActive="active" class="nav-item">
          <i class="bi bi-diagram-3-fill"></i>
          <span>Departments</span>
        </a>
        <a routerLink="/attendance" routerLinkActive="active" class="nav-item">
          <i class="bi bi-calendar-check-fill"></i>
          <span>Attendance</span>
        </a>
        <a routerLink="/leaves" routerLinkActive="active" class="nav-item">
          <i class="bi bi-calendar-x-fill"></i>
          <span>Time Off</span>
        </a>
        <a routerLink="/payroll" routerLinkActive="active" class="nav-item">
          <i class="bi bi-cash-stack"></i>
          <span>Payroll</span>
        </a>
        <a routerLink="/performance" routerLinkActive="active" class="nav-item">
          <i class="bi bi-graph-up-arrow"></i>
          <span>Performance</span>
        </a>
        <a routerLink="/notifications" routerLinkActive="active" class="nav-item">
          <i class="bi bi-bell-fill"></i>
          <span>Notifications</span>
        </a>
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <i class="bi bi-person-gear"></i>
          <span>Users</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar">{{ getUserInitials() }}</div>
        <div class="user-info">
          <span class="user-name">{{ getUserName() }}</span>
          <span class="user-role">{{ getUserRole() }}</span>
        </div>
        <button class="logout-btn" (click)="logout()" title="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </div>
}
