<div class="form-container">
  <div class="header">
    <h2>
      {{ isEditMode ? 'Edit Performance' : 'Add Performance' }}
    </h2>

    <a routerLink="/performance" class="btn-back"> Back to List </a>
  </div>

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  @if (loading && isEditMode) {
    <p class="loading-text">Loading performance review...</p>
  } @else {
    <form (ngSubmit)="onSubmit()" #performanceForm="ngForm" class="record-form">
      <div class="form-row">
        <div class="form-group">
          <label>Employee</label>

          <select name="employee" [(ngModel)]="performance.employee" required>
            <option value="" disabled>Select employee</option>

            @for (employee of employees; track employee._id) {
              <option [value]="employee._id">
                {{ employee.firstName }}
                {{ employee.lastName }}
              </option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>Review Date</label>

          <input type="date" name="reviewDate" [(ngModel)]="performance.reviewDate" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Reviewer</label>

          <input type="text" name="reviewer" [(ngModel)]="performance.reviewer" required />
        </div>

        <div class="form-group">
          <label>Score</label>

          <input
            type="number"
            name="score"
            [(ngModel)]="performance.score"
            min="0"
            max="5"
            step="0.1"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Goals</label>

        <textarea name="goals" [(ngModel)]="performance.goals" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label>Comments</label>

        <textarea name="comments" [(ngModel)]="performance.comments" rows="4"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="!performanceForm.valid || loading">
          {{ loading ? 'Saving...' : 'Save Performance' }}
        </button>
      </div>
    </form>
  }
</div>
