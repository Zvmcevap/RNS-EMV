<div class="register-container">

    <div class="register-card">

        <h2>Create Account</h2>

        <form (ngSubmit)="register()">

            <div class="form-group">

                <label>First Name</label>

                <input
                    type="text"
                    name="firstName"
                    [(ngModel)]="firstName"
                    required>

            </div>

            <div class="form-group">

                <label>Last Name</label>

                <input
                    type="text"
                    name="lastName"
                    [(ngModel)]="lastName"
                    required>

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    [(ngModel)]="email"
                    required>

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    [(ngModel)]="phone"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    [(ngModel)]="password"
                    required>

            </div>

            <div class="form-group">

                <label>Role</label>

                <select
                    name="role"
                    [(ngModel)]="role">

                    <option value="employee">Employee</option>
                    <option value="admin">Admin</option>

                </select>

            </div>

            <div class="form-group">

                <label>Profile Image</label>

                <input
                    type="file"
                    accept="image/*"
                    (change)="onFileSelected($event)">

            </div>

            <button
                type="submit"
                [disabled]="loading">

                {{ loading ? 'Creating Account...' : 'Register' }}

            </button>

        </form>

        <div
            class="error"
            *ngIf="error">

            {{ error }}

        </div>

    </div>

</div>
